<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%" viewBox="0 0 420 760"
     preserveAspectRatio="xMidYMid meet">
  <title>SVG SMIL Interaction Demo - Mobile Friendly</title>
  <desc>Click rectangles to trigger SVG/SMIL animations. Double-click the background or any item to reset the scene.</desc>

  <style><![CDATA[
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    svg { background:#f7f7f7; touch-action: manipulation; user-select:none; }
    .label { font-size:15px; fill:#222; pointer-events:none; font-weight:600; }
    .hint { font-size:12px; fill:#555; pointer-events:none; }
    .tile { cursor:pointer; stroke:#222; stroke-width:2; rx:18; ry:18; }
    .small { font-size:11px; fill:#333; pointer-events:none; }
    .target { cursor:pointer; }
  ]]></style>

  <!-- Full-area reset target. It is behind the animated scene. -->
  <rect id="resetArea" x="0" y="0" width="420" height="760" fill="#f7f7f7"/>

  <text x="20" y="34" class="label">SVG SMIL interaction demo</text>
  <text x="20" y="54" class="hint">Tap/click a card. Double-click anywhere to reset.</text>

  <!-- Everything in this group acts like a camera/layer. -->
  <g id="camera">
    <!-- CAMERA RESET: dblclick anywhere useful -->
    <animateTransform id="camResetTranslate1" attributeName="transform" type="translate"
      additive="sum" begin="resetArea.dblclick; card1.dblclick; card2.dblclick; card3.dblclick; card4.dblclick; card5.dblclick; card6.dblclick; card7.dblclick; card8.dblclick"
      to="0 0" dur="0.6s" fill="freeze"/>

    <!-- Grid cards -->
    <g id="card1" class="target" transform="translate(20 85)">
      <rect class="tile" width="180" height="105" fill="#ffadad"/>
      <text x="16" y="30" class="label">1. Fade</text>
      <text x="16" y="54" class="small">tap to fade</text>
      <circle cx="145" cy="58" r="20" fill="#b00020" opacity="1">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" begin="card1.click" fill="freeze"/>
        <set attributeName="opacity" to="1" begin="resetArea.dblclick; card1.dblclick; card2.dblclick; card3.dblclick; card4.dblclick; card5.dblclick; card6.dblclick; card7.dblclick; card8.dblclick"/>
      </circle>
    </g>

    <g id="card2" class="target" transform="translate(220 85)">
      <rect class="tile" width="180" height="105" fill="#ffd6a5"/>
      <text x="16" y="30" class="label">2. Move</text>
      <text x="16" y="54" class="small">tap to slide</text>
      <rect x="120" y="45" width="34" height="34" fill="#c46d00">
        <animateTransform attributeName="transform" type="translate" values="0 0;-70 0;0 0" dur="1.6s" begin="card2.click" fill="freeze"/>
        <set attributeName="transform" to="translate(0 0)" begin="resetArea.dblclick; card1.dblclick; card2.dblclick; card3.dblclick; card4.dblclick; card5.dblclick; card6.dblclick; card7.dblclick; card8.dblclick"/>
      </rect>
    </g>

    <g id="card3" class="target" transform="translate(20 210)">
      <rect class="tile" width="180" height="105" fill="#caffbf"/>
      <text x="16" y="30" class="label">3. Rotate object</text>
      <text x="16" y="54" class="small">tap to spin</text>
      <rect x="120" y="42" width="38" height="38" fill="#267326">
        <animateTransform attributeName="transform" type="rotate" from="0 139 61" to="360 139 61" dur="1.6s" begin="card3.click" fill="freeze"/>
        <set attributeName="transform" to="rotate(0 139 61)" begin="resetArea.dblclick; card1.dblclick; card2.dblclick; card3.dblclick; card4.dblclick; card5.dblclick; card6.dblclick; card7.dblclick; card8.dblclick"/>
      </rect>
    </g>

    <g id="card4" class="target" transform="translate(220 210)">
      <rect class="tile" width="180" height="105" fill="#9bf6ff"/>
      <text x="16" y="30" class="label">4. Appear</text>
      <text x="16" y="54" class="small">tap to reveal</text>
      <text x="84" y="78" class="label" opacity="0">HELLO
        <animate attributeName="opacity" from="0" to="1" dur="1.0s" begin="card4.click" fill="freeze"/>
        <set attributeName="opacity" to="0" begin="resetArea.dblclick; card1.dblclick; card2.dblclick; card3.dblclick; card4.dblclick; card5.dblclick; card6.dblclick; card7.dblclick; card8.dblclick"/>
      </text>
    </g>

    <g id="card5" class="target" transform="translate(20 335)">
      <rect class="tile" width="180" height="105" fill="#bdb2ff"/>
      <text x="16" y="30" class="label">5. Color</text>
      <text x="16" y="54" class="small">tap to change</text>
      <rect x="115" y="42" width="46" height="38" fill="#5a189a">
        <animate attributeName="fill" values="#5a189a;#ffbe0b;#fb5607;#5a189a" dur="2.0s" begin="card5.click" fill="freeze"/>
        <set attributeName="fill" to="#5a189a" begin="resetArea.dblclick; card1.dblclick; card2.dblclick; card3.dblclick; card4.dblclick; card5.dblclick; card6.dblclick; card7.dblclick; card8.dblclick"/>
      </rect>
    </g>

    <!-- Camera zoom/pan: simulate viewBox by transforming the whole scene. -->
    <g id="card6" class="target" transform="translate(220 335)">
      <rect class="tile" width="180" height="105" fill="#fdffb6"/>
      <text x="16" y="30" class="label">6. Camera zoom</text>
      <text x="16" y="54" class="small">tap to zoom in/out</text>
    </g>

    <g id="card7" class="target" transform="translate(20 460)">
      <rect class="tile" width="180" height="105" fill="#ffc6ff"/>
      <text x="16" y="30" class="label">7. Camera rotate</text>
      <text x="16" y="54" class="small">tap to rotate scene</text>
    </g>

    <g id="card8" class="target" transform="translate(220 460)">
      <rect class="tile" width="180" height="105" fill="#a0c4ff"/>
      <text x="16" y="30" class="label">8. Combo</text>
      <text x="16" y="54" class="small">zoom + rotate + pan</text>
    </g>

    <g transform="translate(20 610)">
      <rect x="0" y="0" width="380" height="90" rx="18" ry="18" fill="#ffffff" stroke="#bbb"/>
      <text x="18" y="30" class="label">Other events</text>
      <text x="18" y="54" class="hint">Hover works on desktop. Double-click resets. Right-click usually opens the browser menu.</text>
      <text x="18" y="74" class="hint">Long press / Escape / reliable right-click actions need JavaScript.</text>
    </g>
  </g>

  <!-- Overlay camera animations, separate from visual cards. Multiple transforms are chained additively. -->
  <animateTransform xlink:href="#camera" xmlns:xlink="http://www.w3.org/1999/xlink"
    attributeName="transform" type="translate" additive="sum"
    values="0 0;-520 -760;0 0" dur="2.4s" begin="card6.click" fill="freeze"/>
  <animateTransform xlink:href="#camera" xmlns:xlink="http://www.w3.org/1999/xlink"
    attributeName="transform" type="scale" additive="sum"
    values="1;3.4;1" dur="2.4s" begin="card6.click" fill="freeze"/>

  <animateTransform xlink:href="#camera" xmlns:xlink="http://www.w3.org/1999/xlink"
    attributeName="transform" type="rotate" additive="sum"
    values="0 210 380;180 210 380;0 210 380" dur="2.2s" begin="card7.click" fill="freeze"/>

  <animateTransform xlink:href="#camera" xmlns:xlink="http://www.w3.org/1999/xlink"
    attributeName="transform" type="translate" additive="sum"
    values="0 0;-270 -360;170 120;0 0" dur="3.2s" begin="card8.click" fill="freeze"/>
  <animateTransform xlink:href="#camera" xmlns:xlink="http://www.w3.org/1999/xlink"
    attributeName="transform" type="scale" additive="sum"
    values="1;2.6;0.55;1" dur="3.2s" begin="card8.click" fill="freeze"/>
  <animateTransform xlink:href="#camera" xmlns:xlink="http://www.w3.org/1999/xlink"
    attributeName="transform" type="rotate" additive="sum"
    values="0 210 380;-45 210 380;35 210 380;0 210 380" dur="3.2s" begin="card8.click" fill="freeze"/>

  <!-- Desktop hover example: background border pulse -->
  <rect x="10" y="75" width="400" height="640" rx="22" ry="22" fill="none" stroke="#999" stroke-width="2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="camera.mouseover" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.25s" begin="camera.mouseout" fill="freeze"/>
  </rect>
</svg>
